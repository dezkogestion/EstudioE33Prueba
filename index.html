<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio E33 Medellín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Estudio de grabación y producción de Entr3t3nimiento en Medellín. Arma tu sesión, revisa la agenda y solicita tu reserva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: "arma tu campamento". Hero tipográfico con tres tipos de campamento (miniaturas pequeñas, nítidas); consola de canales + crew; track sheet como superficie invertida; agenda tipo DAW; hoja de contacto. Sistema E33, claro y oscuro según el dispositivo. */
:root{
  /* --ink = fondo de página, --paper = texto; en claro se invierten */
  --ink:#FFFFFF; --paper:#0A0A0A; --panel:#F5F5F5; --panel-2:#EDEDED; --rule:#D4D4D4; --dim:#6B6B6B; --soft:#4A4A4A;
  --red:#E4172B; --red-dim:#F3C2C7; --on-red:#FFFFFF; --hatch:#DCDCDC;
  --sheet-muted:#9A9A9A; --sheet-rule:#2E2E2E; --sheet-field:#1A1A1A; --shade:rgba(0,0,0,.12);
  --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0A0A0A; --paper:#FFFFFF; --panel:#121212; --panel-2:#1A1A1A; --rule:#2E2E2E; --dim:#6B6B6B; --soft:#B0B0B0;
  --red-dim:#5A0A12; --hatch:#222222; --sheet-muted:#6B6B6B; --sheet-rule:#D4D4D4; --sheet-field:#F5F5F5; --shade:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#0A0A0A; --paper:#FFFFFF; --panel:#121212; --panel-2:#1A1A1A; --rule:#2E2E2E; --dim:#6B6B6B; --soft:#B0B0B0;
  --red-dim:#5A0A12; --hatch:#222222; --sheet-muted:#6B6B6B; --sheet-rule:#D4D4D4; --sheet-field:#F5F5F5; --shade:#000; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1280px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:0;line-height:.9}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ink);border-bottom:1px solid var(--rule)}
.bar .w{display:flex;align-items:center;gap:20px;height:56px}
.wm{font-family:var(--font-display);font-weight:800;letter-spacing:.2em;font-size:16px;text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:22px;margin-left:8px}
.bar nav a{text-decoration:none;color:var(--dim)}
.bar nav a:hover{color:var(--paper)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{border:0;background:transparent;cursor:pointer;padding:6px 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.theme{width:34px;height:30px;border:1px solid var(--rule);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.theme i{width:14px;height:14px;border-radius:50%;border:2px solid var(--paper);background:linear-gradient(90deg,var(--paper) 50%,transparent 50%)}
@media (max-width:980px){.bar nav{display:none}}
@media (max-width:420px){.wm{letter-spacing:.12em;font-size:11px}}

/* Buttons */
.key{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--paper);background:var(--paper);color:var(--ink);padding:13px 22px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--red);transition:transform .12s,box-shadow .12s}
.key:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}
.key:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--red)}
.key.ghost{background:transparent;color:var(--paper);box-shadow:4px 4px 0 var(--rule)}
.key.inv{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.key:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* Hero: campamento */
.hero{border-bottom:1px solid var(--rule)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:end;padding-block:64px 72px}
.eyebrow{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim)}
.eyebrow b{color:var(--red);font-weight:500}
.h1{font-size:clamp(64px,9.5vw,144px);font-weight:900;margin:20px 0 0}
.h1 em{font-style:normal;color:var(--red)}
.lead{margin:24px 0 32px;font-size:clamp(17px,1.5vw,20px);line-height:1.5;max-width:44ch;color:var(--soft)}
.lead strong{color:var(--paper);font-weight:600}
.ctas{display:flex;gap:14px;flex-wrap:wrap}
.camps{display:flex;flex-direction:column;border:1px solid var(--paper)}
.camps-h{display:flex;justify-content:space-between;padding:10px 14px;background:var(--paper);color:var(--ink)}
.camp{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px;border-top:1px solid var(--rule);text-align:left;background:transparent;cursor:pointer;border-left:0;border-right:0;border-bottom:0;transition:background .15s}
.camp:first-of-type{border-top:0}
.camp:hover{background:var(--panel)}
.camp img{width:88px;height:88px;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05)}
.camp:hover img{filter:none}
.camp b{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.01em;display:block;line-height:1.1}
.camp p{margin:4px 0 0;color:var(--soft);font-size:14px}
.camp .gear{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:6px;display:block}
.camp .go{font-family:var(--font-mono);font-size:18px;color:var(--red)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:44px;border-top:1px solid var(--rule)}
.facts div{padding:14px 14px 0 0;display:flex;flex-direction:column;gap:4px}
.facts div + div{padding-left:14px;border-left:1px solid var(--rule)}
.facts span{color:var(--dim)}
.facts b{font-family:var(--font-display);font-size:clamp(24px,2.6vw,34px);font-weight:800}
@media (max-width:920px){.hero-grid{grid-template-columns:1fr;gap:40px;padding-block:40px 48px}}
@media (max-width:460px){.camp{grid-template-columns:64px minmax(0,1fr) auto;gap:12px}.camp img{width:64px;height:64px}.camp b{font-size:18px}}

/* Section heads */
section{padding-block:80px;border-bottom:1px solid var(--rule)}
.sh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:32px;align-items:end;margin-bottom:36px}
.sh .mk{display:flex;flex-direction:column;gap:6px;color:var(--dim)}
.sh .mk b{display:flex;align-items:center;gap:8px;color:var(--paper);font-weight:500}
.sh .mk b::before{content:"";width:0;height:0;border-left:8px solid var(--red);border-top:6px solid transparent;border-bottom:6px solid transparent}
.sh h2{font-size:clamp(48px,7.4vw,112px);font-weight:900}
.sh p{margin:0;color:var(--soft);font-size:18px;line-height:1.5}
@media (max-width:900px){.sh{grid-template-columns:1fr;gap:12px}}

/* Console */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
@media (max-width:1080px){.desk{grid-template-columns:1fr}}
.wiz-nav{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wiz-nav button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-top:3px solid var(--rule);padding:10px 2px 4px;cursor:pointer;text-align:left;color:var(--dim)}
.wiz-nav .n{font-family:var(--font-mono);font-size:12px}
.wiz-nav .l{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz-nav button.done{border-top-color:var(--paper);color:var(--soft)}
.wiz-nav button[aria-current="step"]{border-top-color:var(--red);color:var(--paper)}
@media (max-width:640px){.wiz-nav .l{display:none}.wiz-nav button[aria-current="step"] .l{display:inline}.wiz-nav{grid-template-columns:repeat(5,auto);justify-content:start}}
.mod{border:1px solid var(--rule);background:var(--panel);display:none}
.mod.on{display:block}
.wiz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.wiz-foot .mono{color:var(--dim)}
.key.sm{padding:8px 12px;font-size:11px;box-shadow:3px 3px 0 var(--rule)}
.lbl2{display:block;color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--rule)}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;font-size:16px;font-weight:600;color:var(--dim);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--red)}
.mod-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule);color:var(--dim)}
.mod-h b{color:var(--paper);font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.mod-b{padding:20px}
.hint{margin:0 0 16px;color:var(--soft);font-size:16px;max-width:60ch}

.transport{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.transport{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tk{position:relative;text-align:left;cursor:pointer;background:var(--panel-2);border:1px solid var(--rule);padding:30px 14px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--shade);transition:transform .1s,box-shadow .1s,border-color .15s}
.tk::before{content:"";position:absolute;top:12px;left:14px;width:22px;height:4px;background:var(--rule)}
.tk:hover{border-color:var(--dim)}
.tk[aria-pressed="true"]{transform:translateY(3px);box-shadow:0 1px 0 var(--shade);border-color:var(--paper)}
.tk[aria-pressed="true"]::before{background:var(--red);box-shadow:0 0 10px var(--red)}
.tk .t{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.1}
.tk .p{font-family:var(--font-mono);font-size:15px;color:var(--paper);font-weight:700}
.tk .d{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

.toggles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tg{display:flex;align-items:center;gap:14px;cursor:pointer;border:1px solid var(--rule);padding:12px 14px;background:var(--panel-2)}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .sw{width:20px;height:38px;border:2px solid var(--soft);border-radius:3px;position:relative;flex:none}
.tg .sw::after{content:"";position:absolute;left:2px;right:2px;height:14px;bottom:2px;background:var(--soft);transition:bottom .15s,background .15s}
.tg input:checked + .sw{border-color:var(--red)}
.tg input:checked + .sw::after{bottom:18px;background:var(--red)}
.tg input:focus-visible + .sw{outline:2px solid var(--red);outline-offset:3px}
.tg b{display:block;font-weight:600}
.tg small{color:var(--dim);font-size:13px}
.time{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:12px}
.step{display:flex;align-items:stretch;border:1px solid var(--rule);background:var(--ink)}
.step button{width:42px;border:0;background:transparent;cursor:pointer;font-family:var(--font-mono);font-size:18px}
.step button:hover{background:var(--panel-2)}
.step output{min-width:52px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:20px;color:var(--red);border-inline:1px solid var(--rule);padding:6px 8px}
.slotinfo{color:var(--soft);font-size:15px}
.slotinfo b{color:var(--paper)}

/* Crew */
.crew{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.crew{grid-template-columns:1fr}}
.send{border:1px solid var(--rule);background:var(--panel-2);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.send b{display:block;font-weight:600}
.send small{font-size:13px;color:var(--dim);display:block}
.send .step output{min-width:40px;font-size:16px}
.room{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.seats{display:flex;gap:4px;flex-wrap:wrap}
.seats i{width:18px;height:22px;border:1px solid var(--rule);border-radius:9px 9px 2px 2px;display:block}
.seats i.on{background:var(--paper);border-color:var(--paper)}
.seats i.over{background:var(--red);border-color:var(--red)}
.seats i.cap{border-style:dashed}
.room-n{font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--soft)}
.room-n b{font-family:var(--font-display);font-weight:900;font-size:36px;color:var(--paper);display:block;line-height:1}
.room-msg{margin-top:10px;font-size:14px;color:var(--soft);border-left:3px solid var(--rule);padding-left:10px}
.room-msg.warn{border-color:var(--red);color:var(--paper)}

.presets{display:flex;gap:8px;flex-wrap:wrap}
.pr{border:1px solid var(--rule);background:transparent;padding:6px 12px;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.pr:hover{border-color:var(--paper);color:var(--paper)}
.pr[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin-top:14px}
.ch{position:relative;cursor:pointer;border:1px solid var(--rule);background:var(--panel-2);padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:border-color .15s}
.ch:hover{border-color:var(--dim)}
.ch[aria-pressed="true"]{border-color:var(--paper)}
.ch .cn{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.1em;width:100%;display:flex;justify-content:space-between;align-items:center}
.ch .led{width:8px;height:8px;border-radius:50%;background:var(--red-dim)}
.ch[aria-pressed="true"] .led{background:var(--red);box-shadow:0 0 8px var(--red)}
.knob{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);position:relative;transition:transform .3s}
.knob::after{content:"";position:absolute;left:50%;top:2px;width:2px;height:6px;margin-left:-1px;background:var(--paper)}
.ch[aria-pressed="true"] .knob{transform:rotate(110deg);border-color:var(--paper)}
.scribble{width:100%;background:var(--ink);border:1px solid var(--rule);font-family:var(--font-mono);font-size:11px;font-weight:700;padding:3px 2px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch[aria-pressed="true"] .scribble{color:var(--ink);background:var(--paper);border-color:var(--paper)}
.fader{position:relative;width:100%;height:44px;display:flex;justify-content:center}
.fader::before{content:"";width:4px;height:100%;background:var(--ink);border:1px solid var(--rule)}
.fader .cap{position:absolute;left:50%;width:28px;height:10px;margin-left:-14px;bottom:2px;background:var(--soft);border-top:3px solid var(--ink);transition:bottom .35s cubic-bezier(.2,.8,.2,1)}
.ch[aria-pressed="true"] .cap{bottom:30px;background:var(--paper)}
.ch .nm{font-size:11px;line-height:1.25;color:var(--soft);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .ct{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ch .q{position:absolute;top:26px;right:6px;font-family:var(--font-mono);font-size:9px;color:var(--dim)}
.sends{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.combo{margin-top:10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--red);padding:10px 12px}
.combo b{color:var(--red)}

/* Track sheet (superficie invertida) */
.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--paper);color:var(--ink);box-shadow:8px 8px 0 var(--red);font-family:var(--font-mono)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 18px 14px;border-bottom:3px solid var(--ink)}
.sheet-h h3{font-family:var(--font-display);font-size:36px;letter-spacing:.01em;font-weight:900}
.sheet-h .id{font-size:11px;text-align:right;line-height:1.5}
.fields{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ink)}
.fields div{padding:8px 18px;border-bottom:1px solid var(--sheet-rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.fields div:nth-child(odd){border-right:1px solid var(--sheet-rule)}
.fields div.full{grid-column:span 2;border-right:0}
.fields span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sheet-muted)}
.fields b{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.trk{padding:10px 18px;border-bottom:1px solid var(--ink)}
.trk-h{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--sheet-muted);margin-bottom:6px;display:flex;justify-content:space-between}
.trk ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.trk li{display:flex;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dotted var(--sheet-rule);min-width:0}
.trk li i{font-style:normal;color:var(--red);font-weight:700}
.trk li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .none{font-size:12px;color:var(--sheet-muted)}
.lines{padding:10px 18px;display:flex;flex-direction:column;gap:6px}
.ln{display:flex;justify-content:space-between;gap:12px;font-size:12px}
.ln span:first-child{font-family:var(--font-body);font-size:13px}
.tot{position:relative;padding:14px 18px 18px;border-top:3px solid var(--ink);display:flex;justify-content:space-between;align-items:end;gap:12px}
.tot .lbl{font-size:10px;letter-spacing:.12em;color:var(--sheet-muted)}
.tot .usd{font-family:var(--font-display);font-size:60px;font-weight:900;line-height:.85;letter-spacing:0}
.tot .cop{font-size:11px;text-align:right;line-height:1.6;color:var(--sheet-muted)}
.stamp{position:absolute;right:16px;top:-14px;transform:rotate(-6deg);border:2px solid var(--red);color:var(--red);padding:2px 8px;font-size:10px;letter-spacing:.14em;font-weight:700;background:var(--paper)}
.sheet .gobtn{margin:0 18px 10px;width:calc(100% - 36px);justify-content:center}
.sheet .warnline{padding:0 18px 8px;font-family:var(--font-body);font-size:12px;font-weight:600}
.sheet .foot{padding:0 18px 16px;font-size:10px;line-height:1.5;color:var(--sheet-muted);font-family:var(--font-body)}

/* Timeline */
.tl-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 10px;flex-wrap:wrap}
.tl-top .key{padding:9px 14px}
.tl-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
.tl{display:grid;grid-template-columns:110px repeat(7,minmax(82px,1fr));min-width:690px}
.tl .ruler{border-bottom:1px solid var(--rule);border-left:1px solid var(--rule);padding:10px 12px}
.tl .ruler b{font-family:var(--font-display);font-weight:800;font-size:30px;display:block;line-height:1}
.tl .ruler.today b{color:var(--red)}
.tl .corner{border-bottom:1px solid var(--rule);padding:10px 12px;color:var(--dim)}
.tl .trkname{border-bottom:1px solid var(--rule);padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--panel-2)}
.tl .trkname b{font-family:var(--font-mono);font-size:12px;font-weight:500}
.tl .trkname small{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.tl .lane{border-bottom:1px solid var(--rule);border-left:1px solid var(--rule);padding:5px;min-height:56px}
.rg{width:100%;height:100%;min-height:44px;border:1px dashed transparent;background:transparent;cursor:pointer;text-align:left;padding:6px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:flex-end}
.rg:hover{border-color:var(--soft);color:var(--paper)}
.rg.busy{cursor:not-allowed;background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--hatch) 6px 12px);border:1px solid var(--rule)}
.rg.sel{background:var(--red);border:1px solid var(--red);color:var(--on-red);font-weight:700}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;color:var(--dim)}
.legend i{display:inline-block;width:18px;height:10px;margin-right:8px}

/* Contact sheet */
.contact{background:var(--paper);color:var(--ink);padding:14px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.fr{grid-column:span 4;margin:0;cursor:zoom-in;display:flex;flex-direction:column;gap:6px}
.fr:nth-child(1){grid-column:span 7;grid-row:span 2}
.fr:nth-child(2),.fr:nth-child(3){grid-column:span 5}
.fr .img{position:relative;overflow:hidden;background:var(--ink);aspect-ratio:4/3;flex:1}
.fr:nth-child(1) .img{aspect-ratio:auto}
.fr img,.fr video{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.1);transition:filter .5s}
.fr:hover img,.fr:focus-visible img{filter:none}
.fr figcaption{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.fr figcaption i{font-style:normal;color:var(--red);font-weight:700}
@media (max-width:760px){.contact{grid-template-columns:1fr 1fr}.fr,.fr:nth-child(n){grid-column:span 1;grid-row:auto}.fr:nth-child(1){grid-column:span 2}.fr:nth-child(1) .img{aspect-ratio:4/3}}
.lb{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 96%,transparent);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px}
.lb img{max-height:86vh;max-width:100%;border:8px solid var(--paper)}
.lb button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px))}

/* Flow: línea de tiempo con los estados reales de la solicitud */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;position:relative}
.flow::before{content:"";position:absolute;left:22px;right:22px;top:22px;height:2px;background:linear-gradient(90deg,var(--paper) 0 20%,var(--red) 20% 60%,var(--paper) 60%)}
.flow li{position:relative;display:flex;flex-direction:column;gap:12px}
.flow .node{width:46px;height:46px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;font-weight:700;position:relative;z-index:1}
.flow li.us .node{border-color:var(--red);color:var(--red)}
.flow .st{color:var(--dim)}
.flow .st::before{content:"● ";color:var(--paper)}
.flow li.us .st::before{color:var(--red)}
.flow .card{border:1px solid var(--rule);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.flow li.us .card{background:var(--panel-2)}
.flow .meta{display:flex;justify-content:space-between;gap:8px;color:var(--dim)}
.flow .who{border:1px solid var(--paper);color:var(--paper);padding:2px 8px}
.flow .who.us{border-color:var(--red);background:var(--red);color:var(--on-red)}
.flow b{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.flow p{margin:0;color:var(--soft);font-size:16px;line-height:1.5}
.flow-note{margin:28px 0 0;padding:16px 18px;border:1px dashed var(--rule);color:var(--soft);font-size:15px;max-width:72ch}
.flow-note b{color:var(--paper)}
@media (max-width:1000px){
  .flow{grid-template-columns:1fr;gap:0}
  .flow::before{left:22px;right:auto;top:22px;bottom:22px;width:2px;height:auto;background:linear-gradient(180deg,var(--paper) 0 20%,var(--red) 20% 60%,var(--paper) 60%)}
  .flow li{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:16px;padding-bottom:18px}
  .flow .node{grid-row:span 2}
  .flow .st{align-self:center}
  .flow .card{grid-column:2}
}

/* Rider */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 48px}
.spec h3{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--red);padding:22px 0 8px;border-bottom:2px solid var(--paper)}
.spec ul{list-style:none;margin:0 0 8px;padding:0}
.spec li{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.spec li b{font-weight:500}
.spec li::after{content:"";order:2;flex:1;border-bottom:1px dotted var(--dim);transform:translateY(-4px)}
.spec li span{order:3;font-family:var(--font-mono);font-size:12px;color:var(--soft)}

/* Conditions */
.cond{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);margin-top:24px}
.cond div{padding:18px 20px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.cond div:last-child{border-right:0}
.cond .big{font-family:var(--font-display);font-size:52px;font-weight:900;line-height:.85;letter-spacing:0}
.cond .big em{font-style:normal;color:var(--red)}
.cond p{margin:0;color:var(--soft);font-size:15px}
@media (max-width:900px){.cond{grid-template-columns:1fr 1fr}.cond div:nth-child(2){border-right:0}.cond div:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
@media (max-width:520px){.cond{grid-template-columns:1fr}.cond div{border-right:0;border-bottom:1px solid var(--rule)}}

footer{padding-block:48px 32px}
footer .huge{font-family:var(--font-display);font-weight:900;font-size:clamp(40px,12vw,176px);letter-spacing:.02em;line-height:1;white-space:nowrap;overflow:hidden}
footer .row{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:24px;color:var(--dim)}

/* Dialog (superficie invertida) */
.req{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 90%,transparent);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.req-card{background:var(--paper);color:var(--ink);box-shadow:10px 10px 0 var(--red);width:min(580px,100%);max-height:90vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.req-card h3{font-size:42px}
.req-card label{display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.req-card input,.req-card textarea{font:400 16px var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--sheet-field);border:0;border-bottom:2px solid var(--ink);padding:10px 4px}
.req-card input:focus,.req-card textarea:focus{outline:none;border-bottom-color:var(--red)}
.req-card pre{white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;background:var(--sheet-field);padding:12px;margin:0}
.req-card .key{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.req-card .key.ghost{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--sheet-rule)}
.fs{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fs legend{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;padding:0}
.req-card .rd{flex-direction:row;align-items:center;gap:10px;font-family:var(--font-body);font-size:15px;letter-spacing:0;text-transform:none;cursor:pointer}
.rd input{accent-color:var(--red);width:18px;height:18px;margin:0}
.wait{background:var(--ink);color:var(--paper);padding:12px 14px;font-size:14px;line-height:1.45}
.wait b{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.err{color:var(--red);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--red);color:var(--on-red);padding:10px 16px;z-index:40;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>

const S = { lang:"es", mode:"bloque", eng:true, night:false, hours:2, extra:0, crew:{art:1,prod:0,acomp:1},

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const T = (k, v={}) => { let s = (I18N[S.lang][k] ?? I18N.es[k] ?? k); if (typeof s === "string") for (const [a,b] of Object.entries(v)) s = s.replaceAll("{"+a+"}", b); return s; };
const L = (o, f) => (S.lang === "en" && o[f+"_en"]) ? o[f+"_en"] : o[f];
const loc = () => S.lang === "en" ? "en-US" : "es-CO";
const fmtUSD = n => "USD " + n.toLocaleString(loc(),{maximumFractionDigits:0});
const fmtCOP = n => "$" + (Math.round(n/1000)*1000).toLocaleString("es-CO") + " COP";
const people = () => Object.values(S.crew).reduce((a,b)=>a+b,0);

function applyStatic(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  $("#theme").setAttribute("aria-label", T("theme"));
  $("#r-rider").placeholder = T("rq.ph.rider"); $("#r-notes").placeholder = T("rq.ph.notes");
  $("#flow").innerHTML = T("rs.s").map(([b,p,w,tm,st],i)=>{ const us = w === "E33";
    return `<li class="${us?"us":""}"><div class="node" aria-hidden="true">${pad(i+1)}</div><div class="st mono">${esc(st)}</div><div class="card"><div class="meta mono"><span class="who ${us?"us":""}">${us?T("rs.us"):esc(w)}</span><span>${esc(tm)}</span></div><b>${esc(b)}</b><p>${esc(p)}</p></div></li>`; }).join("");
  $("#flow-note").innerHTML = T("rs.note") + (CONFIG.WHATSAPP ? ` <span class="mono">+${esc(CONFIG.WHATSAPP)}</span>` : "");
}

function calc(){
  const t = DATA.tarifas[S.mode], lines = []; let usd = 0;
  const base = S.eng ? t.con : t.sin;
  if (S.mode === "hora"){
    const rate = Math.round(base * (S.night ? 1 + DATA.nocturno : 1));
    lines.push([T("ln.horas",{h:S.hours,r:fmtUSD(rate)}) + (S.night?T("ln.noct"):""), rate*S.hours]); usd += rate*S.hours;
  } else {
    lines.push([L(t,"label"), base]); usd += base;
    if (S.extra > 0 && t.extraSin){ const r = S.eng ? t.extraCon : t.extraSin; lines.push([T("ln.extra",{h:S.extra}), r*S.extra]); usd += r*S.extra; }
  }
  const P = id => DATA.produccion.find(p => p.id === id);
  const a = S.prod.mezcla||0, m = S.prod.master||0, cb = P("mixmaster"), both = cb ? Math.min(a,m) : 0;
  if (both){ lines.push([`${T("post.cb")} × ${both}`, cb.usd*both]); usd += cb.usd*both; }
  if (a-both > 0){ lines.push([`${T("post.solomz")} × ${a-both}`, P("mezcla").usd*(a-both)]); usd += P("mezcla").usd*(a-both); }
  if (m-both > 0){ lines.push([`${T("post.soloms")} × ${m-both}`, P("master").usd*(m-both)]); usd += P("master").usd*(m-both); }
  return { usd, lines, songs: Math.max(a,m) };
}
function sessionId(){ return "E33-" + (S.slot ? S.slot.date.replaceAll("-","").slice(2) + S.slot.fr.toUpperCase() : "XXXXXX"); }
function shortOf(e){ return e.short || String(e.name).split(" ").pop(); }
function slotLabel(){
  if (!S.slot) return null;
  const d = new Date(S.slot.date+"T12:00:00");
  const dl = d.toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"}).replaceAll(".","");
  const f = DATA.franjas.find(x=>x.id===S.slot.fr);
  return `${dl} · ${S.slot.fr==="dia" ? T("ag.dia") : f ? f.label : ""}`;
}

function renderCamps(){
  const head = $("#camps").firstElementChild.outerHTML;
  $("#camps").innerHTML = head + DATA.presets.map((p,i)=>{
    const eq = p.eq.map(id => DATA.equipos.find(e=>e.id===id)).filter(Boolean).map(shortOf).join(" · ");
    return `<button type="button" class="camp" data-camp="${i}"><img src="${THUMBS[p.img]||THUMBS.control}" alt=""><span><b>${esc(L(p,"label"))}</b><p>${esc(L(p,"desc"))}</p><span class="gear">${esc(eq)}</span></span><span class="go" aria-hidden="true">→</span></button>`;
  }).join("");
}

function render(){
  const t = DATA.tarifas[S.mode];
  $("#modes").innerHTML = Object.entries(DATA.tarifas).map(([k,x]) =>
    `<button type="button" class="tk" aria-pressed="${S.mode===k}" data-mode="${k}"><span class="t">${esc(L(x,"label"))}</span><span class="p num">${fmtUSD(S.eng?x.con:x.sin)}${k==="hora"?" / h":""}</span><span class="d">${esc(L(x,"desc"))}</span></button>`).join("");
  $("#eng").checked = S.eng; $("#night").checked = S.night;
  $("#night-wrap").hidden = S.mode !== "hora";
  $("#hstep").hidden = S.mode === "paquete";
  $("#h-dec").setAttribute("aria-label","−"); $("#h-inc").setAttribute("aria-label","+");
  $("#hours-l").textContent = S.mode === "hora" ? T("time.horas") : S.mode === "paquete" ? T("time.paq") : T("time.extra");
  $("#hours").textContent = S.mode === "hora" ? S.hours : S.extra;
  const sl = slotLabel();
  $("#slot-l").innerHTML = S.mode === "paquete" ? T("time.paqtxt") : sl ? `<b>${esc(sl)}</b>` : T("time.pick");
  // wizard
  document.querySelectorAll(".mod[data-step]").forEach(m => m.classList.toggle("on", +m.dataset.step === S.step));
  const steps = [0,1,2,3,4].map(i => T("w."+i));
  $("#wiz-nav").innerHTML = steps.map((s,i)=>`<li><button type="button" data-step-go="${i}" aria-current="${i===S.step?"step":"false"}" class="${i<S.step?"done":""}"><span class="n">${i+1}</span><span class="l">${esc(s)}</span></button></li>`).join("");
  $("#w-prev").disabled = S.step === 0;
  $("#w-next").textContent = S.step === 4 ? T("w.done") : T("w.next") + " →";
  $("#w-pos").textContent = T("w.of",{a:S.step+1,b:5});

  // crew
  $("#crew").innerHTML = DATA.crew.map(c => `<div class="send"><div><b>${esc(L(c,"label"))}</b><small>${esc(L(c,"desc"))}</small></div><div class="step"><button type="button" data-cr="${c.id}" data-d="-1" aria-label="− ${esc(L(c,"label"))}">−</button><output class="num">${S.crew[c.id]||0}</output><button type="button" data-cr="${c.id}" data-d="1" aria-label="+ ${esc(L(c,"label"))}">+</button></div></div>`).join("");
  const n = people(), cap = DATA.capacidad;
  const slots = Math.max(cap.max, n);
  $("#seats").innerHTML = [...Array(slots)].map((_,i)=>`<i class="${i<n ? (i>=cap.comoda ? "on over":"on") : ""} ${i===cap.comoda-1||i===cap.max-1?"cap":""}"></i>`).join("");
  $("#ppl").textContent = n;
  $("#crew-n").textContent = `${n} ${T("crew.personas")}`;
  const msg = $("#room-msg");
  msg.className = "room-msg" + (n > cap.comoda ? " warn" : "");
  msg.textContent = n > cap.max ? T("crew.max",{m:cap.max}) : n > cap.comoda ? T("crew.lounge",{c:cap.comoda}) : T("crew.ok");

  // channels
  $("#presets").innerHTML = DATA.presets.map((p,i)=>`<button type="button" class="pr" aria-pressed="${S.preset===i}" data-preset="${i}">${esc(L(p,"label"))}</button>`).join("") +
    `<button type="button" class="pr" aria-pressed="${S.preset===-1}" data-preset="-1">${T("ch.free")}</button>`;
  $("#gear").innerHTML = DATA.equipos.map((e,i) =>
    `<button type="button" class="ch" aria-pressed="${S.eq.has(e.id)}" data-eq="${esc(e.id)}" aria-label="${esc(L(e,"cat"))} ${esc(L(e,"name"))}">
      <span class="cn"><span>CH ${pad(i+1)}</span><span class="led"></span></span>
      <span class="knob" aria-hidden="true"></span>
      <span class="scribble">${esc(shortOf(e))}</span>
      <span class="fader" aria-hidden="true"><span class="cap"></span></span>
      <span class="nm">${esc(L(e,"name"))}</span>
      <span class="ct">${esc(L(e,"cat"))}</span>
      ${e.qty>1?`<span class="q">×${e.qty}</span>`:""}
    </button>`).join("");

  // post
  $("#prod").innerHTML = DATA.produccion.filter(p => p.id !== "mixmaster").map(p =>
    `<div class="send"><div><b>${esc(L(p,"label"))}</b><small>${fmtUSD(p.usd)} / ${T("post.cancion")}</small></div><div class="step"><button type="button" data-pd="${esc(p.id)}" data-d="-1" aria-label="− ${esc(L(p,"label"))}">−</button><output class="num">${S.prod[p.id]||0}</output><button type="button" data-pd="${esc(p.id)}" data-d="1" aria-label="+ ${esc(L(p,"label"))}">+</button></div></div>`).join("");
  const P = id => DATA.produccion.find(p => p.id === id), cb = P("mixmaster");
  const both = cb ? Math.min(S.prod.mezcla||0, S.prod.master||0) : 0;
  $("#combo").hidden = !both;
  if (both){ const sv = (P("mezcla").usd + P("master").usd - cb.usd) * both;
    $("#combo").innerHTML = T("post.combo",{n:both,c:both>1?T("post.canciones"):T("post.cancion"),p:fmtUSD(cb.usd)}) + (sv>0?` · <b>${T("post.ahorro",{s:fmtUSD(sv)})}</b>`:""); }

  // sheet
  const sel = DATA.equipos.map((e,i)=>({...e,n:i+1})).filter(e => S.eq.has(e.id));
  $("#ch-count").textContent = `${sel.length} ${sel.length===1?T("ch.act1"):T("ch.act")}`;
  $("#trk").textContent = sel.length ? sel.map(shortOf).join(" · ") : "—";
  const c = calc();
  $("#fd-mode").textContent = L(t,"label");
  $("#fd-eng").textContent = S.eng ? T("f.si") : T("f.no");
  $("#fd-crew").textContent = `${n} ${T("crew.personas")}`;
  $("#fd-post").textContent = c.songs ? `${c.songs} ${c.songs>1?T("post.canciones"):T("post.cancion")}` : T("post.none");
  $("#fd-slot").textContent = S.mode==="paquete" ? T("f.paq") : sl || T("f.tbd");
  $("#lines").innerHTML = c.lines.map(([l,v])=>`<div class="ln"><span>${esc(l)}</span><span class="num">${fmtUSD(v)}</span></div>`).join("");
  $("#t-usd").textContent = fmtUSD(c.usd);
  $("#t-cop").innerHTML = `≈ ${fmtCOP(c.usd*CONFIG.TRM)}<br>${T("f.anticipo")} ${fmtUSD(Math.ceil(c.usd/2))}`;
  $("#trm-note").textContent = T("f.trm",{t:CONFIG.TRM.toLocaleString("es-CO"),d:CONFIG.TRM_FECHA});
  $("#sh-id").textContent = sessionId();
  $("#f-from").textContent = fmtUSD(DATA.tarifas.hora.sin) + " / h";
  renderCal();
}

/* ===== Agenda ===== */
function busy(ds, fr){
  if (Array.isArray(DATA.ocupado)) return DATA.ocupado.includes(ds+"|"+fr);
  let h = 0; for (const ch of ds+fr) h = (h*31 + ch.charCodeAt(0)) % 997; return h % 3 === 0;
}
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function renderCal(){
  const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() + S.week*7);
  const days = [...Array(7)].map((_,i)=>{ const d = new Date(start); d.setDate(start.getDate()+i); return d; });
  const today = iso(new Date());
  const dn = d => d.toLocaleDateString(loc(),{weekday:"short"}).replace(".","");
  let html = `<div class="corner mono">${T("ag.pista")}</div>` + days.map(d=>`<div class="ruler ${iso(d)===today?"today":""}"><span class="mono" style="color:var(--dim)">${dn(d)}</span><b class="num">${pad(d.getDate())}</b></div>`).join("");
  DATA.franjas.forEach((f,i) => {
    html += `<div class="trkname"><b>TR${i+1} · ${esc(L(f,"n"))}</b><small>${esc(f.label)}</small></div>`;
    days.forEach(d => {
      const ds = iso(d), b = busy(ds,f.id), sel = S.slot && S.slot.date===ds && (S.slot.fr===f.id || S.slot.fr==="dia");
      html += `<div class="lane"><button type="button" class="rg ${b?"busy":""} ${sel?"sel":""}" ${b?"disabled":""} data-d="${ds}" data-f="${f.id}" aria-label="${dn(d)} ${d.getDate()} ${f.label} ${b?T("ag.res"):T("ag.libre")}">${b?T("ag.res"):sel?T("ag.tu"):T("ag.libre")}</button></div>`;
    });
  });
  $("#cal").innerHTML = html;
  const fmt = d => d.toLocaleDateString(loc(),{day:"2-digit",month:"short"});
  $("#cal-range").textContent = `${fmt(days[0])} — ${fmt(days[6])}`;
  $("#c-prev").disabled = S.week === 0;
  $("#cal-src").textContent = Array.isArray(DATA.ocupado) ? T("ag.sync") : T("ag.ej");
}

/* ===== Galería / rider ===== */
function renderGal(){
  const media = m => m.tipo === "video"
    ? (/\.(mp4|webm)(\?|$)/i.test(m.src) ? `<video src="${esc(m.src)}" muted loop playsinline autoplay aria-label="${esc(L(m,"cap"))}"></video>`
                                         : `<iframe src="${esc(m.src)}" title="${esc(L(m,"cap"))}" loading="lazy" allow="autoplay" style="border:0;width:100%;height:100%"></iframe>`)
    : `<img src="${esc(m.src||IMAGES[m.k])}" alt="${esc(L(m,"cap"))}, Estudio E33">`;
  $("#gal").innerHTML = DATA.media.map((m,i) => `<figure class="fr" tabindex="0" data-tipo="${m.tipo||"foto"}"><div class="img">${media(m)}</div><figcaption><span><i>${pad(i+1)}A</i> &nbsp;${esc(L(m,"cap"))}</span><span>E33 · MDE</span></figcaption></figure>`).join("");
}
function renderRider(){
  const en = S.lang === "en";
  $("#rider-list").innerHTML = DATA.rider.map(g => `<div><h3>${esc(L(g,"g"))}</h3><ul>${g.items.map(it=>`<li><b>${esc(en && it[2] ? it[2] : it[0])}</b><span>${esc(en && it[3] ? it[3] : it[1])}</span></li>`).join("")}</ul></div>`).join("");
  $("#contact").textContent = (CONFIG.WHATSAPP ? `WhatsApp +${CONFIG.WHATSAPP}` : T("ui.wa")) + " · " + (CONFIG.EMAIL || T("ui.mail"));
}
function renderTabs(){
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  $("#gal").hidden = S.tab !== "fotos"; $("#rider").hidden = S.tab !== "rider";
}
function renderAll(){ applyStatic(); renderCamps(); renderGal(); renderRider(); renderTabs(); render(); }

/* ===== Eventos ===== */
function applyPreset(i){
  const p = DATA.presets[i]; S.preset = i;
  S.eq = new Set(p.eq); S.prod = { ...p.prod }; if (p.crew) S.crew = { ...p.crew };
  if (p.mode && DATA.tarifas[p.mode]){ S.mode = p.mode; S.extra = 0; S.night = false; }
}
document.addEventListener("click", e => {
  const sg = e.target.closest("[data-step-go]");
  if (sg){ S.step = +sg.dataset.stepGo; render(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb){ S.tab = tb.dataset.tab; renderTabs(); return; }
  const lg = e.target.closest("[data-lang]");
  if (lg){ S.lang = lg.dataset.lang; try{ localStorage.setItem("e33-lang", S.lang); }catch(_){} renderAll(); return; }
  const cp = e.target.closest("[data-camp]");
  if (cp){ applyPreset(+cp.dataset.camp); S.step = 1; render(); $("#consola").scrollIntoView(); return; }
  const m = e.target.closest("[data-mode]");
  if (m){ S.mode = m.dataset.mode; S.extra = 0; if (S.mode!=="hora") S.night = false; else S.hours = Math.max(S.hours, DATA.tarifas.hora.min||2);
    if (S.slot && S.mode==="jornada") S.slot = { ...S.slot, fr:"dia" };
    render(); return; }
  const p = e.target.closest("[data-preset]");
  if (p){ const i = +p.dataset.preset; if (i>=0) applyPreset(i); else S.preset = -1; render(); return; }
  const g = e.target.closest("[data-eq]");
  if (g){ const id = g.dataset.eq; S.eq.has(id) ? S.eq.delete(id) : S.eq.add(id); S.preset = -1; render(); return; }
  const pd = e.target.closest("[data-pd]");
  if (pd){ const id = pd.dataset.pd; S.prod[id] = Math.max(0, Math.min(30, (S.prod[id]||0) + +pd.dataset.d)); render(); return; }
  const cr = e.target.closest("[data-cr]");
  if (cr){ const id = cr.dataset.cr; S.crew[id] = Math.max(0, Math.min(20, (S.crew[id]||0) + +cr.dataset.d)); render(); return; }
  const sl = e.target.closest(".rg:not(.busy)");
  if (sl){ S.slot = { date:sl.dataset.d, fr: S.mode==="jornada" ? "dia" : sl.dataset.f }; if (S.mode==="paquete") S.mode = "bloque"; render(); toast(T("ag.toast")); return; }
  const fig = e.target.closest(".fr");
  if (fig && fig.dataset.tipo !== "video"){ openLb(fig); return; }
});
$("#w-prev").addEventListener("click", () => { S.step = Math.max(0, S.step-1); render(); $(".wiz").scrollIntoView({block:"start"}); });
$("#w-next").addEventListener("click", () => { if (S.step < 4){ S.step++; render(); $(".wiz").scrollIntoView({block:"start"}); } else $("#go").click(); });
$("#eng").addEventListener("change", e => { S.eng = e.target.checked; render(); });
$("#night").addEventListener("change", e => { S.night = e.target.checked; render(); });
$("#h-inc").addEventListener("click", () => { if (S.mode==="hora") S.hours = Math.min(DATA.tarifas.hora.max||12, S.hours+1); else S.extra = Math.min(8, S.extra+1); render(); });
$("#h-dec").addEventListener("click", () => { if (S.mode==="hora") S.hours = Math.max(DATA.tarifas.hora.min||2, S.hours-1); else S.extra = Math.max(0, S.extra-1); render(); });
$("#c-prev").addEventListener("click", () => { S.week = Math.max(0, S.week-1); renderCal(); });
$("#c-next").addEventListener("click", () => { S.week = Math.min(8, S.week+1); renderCal(); });

/* Tema: sigue al dispositivo; el botón lo invierte */
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try{ localStorage.setItem("e33-theme", root.dataset.theme); }catch(_){}
});

function openLb(fig){ const im = fig.querySelector("img"); if (!im) return; $("#lb-img").src = im.src; $("#lb-img").alt = im.alt; $("#lb").hidden = false; $("#lb-x").focus(); }
$("#lb").addEventListener("click", e => { if (e.target.id !== "lb-img") $("#lb").hidden = true; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ $("#lb").hidden = true; $("#req").hidden = true; }
  if (e.key === "Enter" && e.target.matches(".fr")) openLb(e.target);
});

/* ===== Solicitud ===== */
function summary(f){
  const c = calc(), sel = DATA.equipos.filter(e=>S.eq.has(e.id)).map(e=>L(e,"name"));
  const crew = DATA.crew.map(x=>`${L(x,"label")} ${S.crew[x.id]||0}`).join(", ");
  return [`${T("sum.sol")} ${sessionId()}`, `${T("sum.art")}: ${f.name}`, `WhatsApp: ${f.phone}`, `${T("sum.mail")}: ${f.mail}`,
    `${T("sum.fmt")}: ${L(DATA.tarifas[S.mode],"label")} ${S.eng?T("sum.con"):T("sum.sin")}`,
    `${T("sum.fr")}: ${slotLabel() || T("f.tbd")}`, `${T("sum.crew")}: ${people()} (${crew})`, `${T("sum.ch")}: ${sel.join(", ") || "—"}`,
    ...c.lines.map(([l,v])=>`· ${l}: ${fmtUSD(v)}`), `${T("sum.tot")}: ${fmtUSD(c.usd)} (≈ ${fmtCOP(c.usd*CONFIG.TRM)})`,
    `${T("sum.rider")}: ${f.rider}`, `${T("sum.miss")}: ${T("miss."+f.miss)}`,
    f.notes ? `${T("sum.notes")}: ${f.notes}` : ""].filter(Boolean).join("\n");
}
$("#go").addEventListener("click", () => {
  $("#req").hidden = false; $("#req-form-body").hidden = false; $("#req-done").hidden = true;
  if (!$("#r-rider").value) $("#r-rider").value = DATA.equipos.filter(e=>S.eq.has(e.id)).map(e=>L(e,"name")).join(", ");
  $("#r-name").focus();
});
$("#req-x").addEventListener("click", () => $("#req").hidden = true);
$("#req-f").addEventListener("submit", async e => {
  e.preventDefault();
  const f = { name:$("#r-name").value.trim(), phone:$("#r-phone").value.trim(), mail:$("#r-mail").value.trim(), rider:$("#r-rider").value.trim(),
    miss:(document.querySelector('input[name="miss"]:checked')||{}).value||"ask", notes:$("#r-notes").value.trim() };
  const err = $("#r-err");
  if (!f.name || !f.phone || !/^\S+@\S+\.\S+$/.test(f.mail) || !f.rider){ err.textContent = T("rq.err"); err.hidden = false; return; }
  err.hidden = true;
  const text = summary(f); let sent = false;
  if (CONFIG.API_URL){
    try {
      const c = calc();
      const r = await fetch(CONFIG.API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({ action:"solicitud", id:sessionId(), lang:S.lang, name:f.name, phone:f.phone, mail:f.mail, notes:f.notes, rider:f.rider,
          faltante:I18N.es["miss."+f.miss], modo:S.mode, ingeniero:S.eng, nocturno:S.night, horas:S.mode==="hora"?S.hours:S.extra,
          fecha:S.slot?.date||"", franja:S.slot?.fr||"", personas:people(), crew:S.crew, equipos:[...S.eq], produccion:S.prod, totalUSD:c.usd, trm:CONFIG.TRM, resumen:text }) });
      const j = await r.json().catch(()=>({})); sent = r.ok && j.ok !== false;
    } catch(_){ sent = false; }
  }
  $("#done-msg").innerHTML = sent ? T("rq.ok") : T("rq.no");
  $("#r-summary").textContent = text;
  const wa = $("#r-wa");
  if (CONFIG.WHATSAPP){ wa.href = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(text)}`; wa.hidden = false; } else wa.hidden = true;
  $("#req-form-body").hidden = true; $("#req-done").hidden = false;
});
$("#r-copy").addEventListener("click", () => {
  navigator.clipboard.writeText($("#r-summary").textContent).then(() => toast(T("rq.copied")), () => { const r = document.createRange(); r.selectNodeContents($("#r-summary")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(T("rq.select")); });
});
let tt; function toast(m){ let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(()=>el.hidden = true, 2200); }

/* ===== Carga desde el Google Sheet ===== */
async function load(){
  if (!CONFIG.API_URL) return;
  try {
    const j = await (await fetch(CONFIG.API_URL + "?action=datos")).json();
    ["tarifas","produccion","equipos","rider","ocupado","nocturno","capacidad"].forEach(k => { if (j[k] != null) DATA[k] = j[k]; });
    if (j.media && j.media.length) DATA.media = j.media;
    if (j.trm){ CONFIG.TRM = j.trm; CONFIG.TRM_FECHA = j.trmFecha || CONFIG.TRM_FECHA; }
    if (j.whatsapp) CONFIG.WHATSAPP = j.whatsapp;
    if (j.email) CONFIG.EMAIL = j.email;
    renderAll();
  } catch(_){}
}

/* Inicio: idioma y tema del dispositivo (o lo último elegido) */
try{ const l = localStorage.getItem("e33-lang"); S.lang = l || ((navigator.language||"es").toLowerCase().startsWith("en") ? "en" : "es"); }catch(_){ S.lang = (navigator.language||"es").toLowerCase().startsWith("en") ? "en" : "es"; }
try{ const th = localStorage.getItem("e33-theme"); if (th) document.documentElement.dataset.theme = th; }catch(_){}
renderAll(); load();
</script>
